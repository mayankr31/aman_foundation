<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Aman Foundation – Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.25rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 20% 0%, #0a8f75 0%, #006857 45%, #003f33 100%);
        color: #12312a;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        border-radius: 1.5rem;
        background: #ffffff;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
      }
      .logo {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.25rem;
        display: block;
        margin: 0 auto 1.25rem;
        box-shadow: 0 8px 24px rgba(0, 104, 87, 0.22);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        color: #52635e;
        font-size: 0.92rem;
        line-height: 1.55;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.25rem;
        background: #006857;
        color: #ffffff;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      button:hover {
        background: #005143;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin: 1rem 0 0;
        font-size: 0.72rem;
        color: #8a9a95;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="Aman Foundation" />
      <h1>You&rsquo;re offline</h1>
      <p>
        The Impact Portal needs an internet connection to load live data. Check
        your connection and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="hint">Your work already saved on the server is safe.</p>
    </main>
  </body>
</html>
