# ═══════════════════════════════════════════════════════════════════════════════
# Aman Foundation — Production Docker Compose
# Stack: Traefik v3 → Next.js 16 + Prisma
# Domain: aman.cloudtales.in
# ═══════════════════════════════════════════════════════════════════════════════

services:


  # ─── App — Next.js 16 + Prisma ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://aman.cloudtales.in}
    image: aman_foundation_app:latest
    container_name: aman_foundation_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://aman.cloudtales.in}
    labels:
      - "traefik.enable=true"
      # ── Pin Traefik to the correct network ───────────────────────────────
      - "traefik.docker.network=kvskhelsathi_default"
      # ── Main app router (aman.cloudtales.in) ─────────────────────────────
      - "traefik.http.routers.aman-foundation.rule=Host(`aman.cloudtales.in`)"
      - "traefik.http.routers.aman-foundation.entrypoints=websecure"
      - "traefik.http.routers.aman-foundation.tls.certresolver=letsencrypt"
      - "traefik.http.services.aman-foundation.loadbalancer.server.port=3000"
      # ── Security headers middleware ────────────────────────────────────────
      - "traefik.http.middlewares.aman-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.aman-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.aman-secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.aman-secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.routers.aman-foundation.middlewares=aman-secure-headers@docker"
    networks:
      - web
      - internal

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  # Public-facing: shared Traefik instance ↔ App
  web:
    external: true
    name: kvskhelsathi_default

  # Private: isolated bridge for inter-service traffic
  # NOTE: internal: true is NOT set — app needs outbound access to the external DB
  internal:
    driver: bridge
